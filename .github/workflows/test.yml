name: Screenshot tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DIFFTRAIL_HEADLESS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Use the pinned npm version
        run: npm install --global npm@10.9.11
      - run: npm ci
      - name: Check dependency advisories
        run: npm run audit:dependencies
      - name: Install Chromium and Linux dependencies
        run: npm exec --workspace=server -- playwright install --with-deps chromium
      - name: Build the pinned AdGuard runtime
        run: node apps/server/benchmarks/setup-adguard.js --runtime
      - name: Run fixtures and native headless integration tests
        run: npm run test:adguard
